{{- if eq .Values.autoscaler "vpa" -}}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  labels:
    app: globeco-order-service
  name: globeco-order-service-vpa
  namespace: globeco
spec:
  resourcePolicy:
    containerPolicies:
    - containerName: globeco-order-service
      controlledResources:
      - cpu
      - memory
      controlledValues: RequestsOnly
      maxAllowed:
        cpu: 6000m
        memory: 6Gi
      minAllowed:
        cpu: 289m
        memory: 700Mi
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: globeco-order-service
  updatePolicy:
    updateMode: InPlaceOrRecreate
{{- end -}}
