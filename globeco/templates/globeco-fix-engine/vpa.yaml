{{- if eq .Values.autoscaler "vpa" -}}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  labels:
    app: globeco-fix-engine
  name: globeco-fix-engine-vpa
  namespace: globeco
spec:
  resourcePolicy:
    containerPolicies:
    - containerName: globeco-fix-engine
      controlledResources:
      - cpu
      - memory
      controlledValues: RequestsOnly
      maxAllowed:
        cpu: 6000m
        memory: 6Gi
      minAllowed:
        cpu: 110m
        memory: 100Mi
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: globeco-fix-engine
  updatePolicy:
    updateMode: InPlaceOrRecreate
{{- end -}}
