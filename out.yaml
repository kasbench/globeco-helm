            - "-c"
            - "pg_stat_statements.track=all"
          volumeMounts:
            - name: globeco-trade-service-postgresdb-storage
              mountPath: /mnt/postgres-data
          resources:
            requests:
              memory: "4Gi"
              cpu: "2000m"
            limits:
              memory: "6Gi"
              cpu: "2000m"
      volumes:
        - name: globeco-trade-service-postgresdb-storage
          persistentVolumeClaim:
            claimName: trade-service-postgres-pvc
