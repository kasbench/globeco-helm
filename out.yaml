apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: globeco-order-generation-service-redis
  namespace: globeco
spec:
  serviceName: globeco-order-generation-service-redis
  replicas: 1
  selector:
    matchLabels:
      app: globeco-order-generation-service-redis
  template:
    metadata:
      labels:
        app: globeco-order-generation-service-redis
    spec:
      securityContext:
        fsGroup: 999  # Redis user group
        runAsNonRoot: true
      containers:
        - name: globeco-order-generation-service-redis
          image: redis:7-alpine
          command: ["redis-server"]
          args: ["/etc/redis/redis.conf"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-config
              mountPath: /etc/redis
          resources:
            requests:
              cpu: "50m"
              memory: "100Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsUser: 999  # Redis user
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
        - name: redis-data
          persistentVolumeClaim:
            claimName: order-generation-service-redis-pvc
