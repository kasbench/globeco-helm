    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z globeco-execution-service-kafka 9092; do echo "Waiting for Kafka..."; sleep 2; done']
      containers:
        - name: globeco-confirmation-service
          image: kasbench/globeco-confirmation-service:1.0.6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          env:
            - name: OTEL_SERVICE_NAME
              value: "globeco-confirmation-service"
            - name: OTEL_SERVICE_VERSION
              value: "1.0.0"
            - name: OTEL_SERVICE_NAMESPACE
              value: "globeco"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "otel-collector-daemonset-collector.globeco.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=globeco-confirmation-service,service.version=1.0.0,service.namespace=globeco"
            - name: TRACING_ENABLED
              value: "true"
            - name: METRICS_ENABLED
              value: "true"
            # Artificial per-message processing delay to slow the processing loop
            # for autoscaling testing. Go duration string (e.g. "50ms", "1s").
            - name: PROCESSING_SLEEP
              value: "50ms"
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: RestartContainer
          resources:
            requests:
              cpu: "100m"
              memory: "200Mi"
            limits:
              memory: "6000Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8086
            # initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8086
            # initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health/ready
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
