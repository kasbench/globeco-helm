# Source: globeco/templates/globeco-order-generation-service/redis.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: globeco
data:
  redis.conf: |
    # Basic Redis configuration
    bind 0.0.0.0
    port 6379

    # Disable RDB snapshots to avoid disk write issues
    save ""
    stop-writes-on-bgsave-error no

    # Use AOF for persistence instead (more reliable for K8s)
    appendonly yes
    appendfsync everysec
    appendfilename "appendonly.aof"

    # Set data directory
    dir /data

    # Logging
    loglevel notice

    # Memory management
    maxmemory-policy allkeys-lru

    # Disable protected mode for K8s
    protected-mode no
---
# Source: globeco/templates/globeco-portfolio-accounting-service/redis.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config-portfolio-accounting
  namespace: globeco
data:
  redis.conf: |
    # Basic Redis configuration
    bind 0.0.0.0
    port 6379

    # Disable RDB snapshots to avoid disk write issues
    save ""
    stop-writes-on-bgsave-error no

    # Use AOF for persistence (optimized for local storage)
    appendonly yes
    appendfsync everysec
    appendfilename "appendonly.aof"
    
    # AOF rewrite optimization for local storage
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    aof-rewrite-incremental-fsync yes

    # Set data directory
    dir /data

    # Logging
    loglevel notice

    # Memory management
    maxmemory-policy allkeys-lru

    # Disable protected mode for K8s
    protected-mode no
    
    # Local storage optimizations
    # Reduce fsync frequency for better performance on local disks
    no-appendfsync-on-rewrite yes
    
    # TCP keepalive for better connection management
    tcp-keepalive 300
