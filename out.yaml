      - "jobs"
      - "cronjobs"
    verbs: ["get", "list", "watch"]
  
  # Autoscaling resources
  - apiGroups: ["autoscaling"]
    resources:
      - "horizontalpodautoscalers"
    verbs: ["get", "list", "watch"]
  
  # Extensions (for some clusters)
  - apiGroups: ["extensions"]
    resources:
      - "deployments"
      - "replicasets"
    verbs: ["get", "list", "watch"]
