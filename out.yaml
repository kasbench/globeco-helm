            limits:
              memory: "6000Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            # initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
