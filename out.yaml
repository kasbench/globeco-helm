    - name: otlp-grpc
      port: 4317
      hostPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      hostPort: 4318
      protocol: TCP
    - name: prometheus
      port: 8889
      hostPort: 8889
      protocol: TCP
    - name: pprof
      port: 1777
      targetPort: 1777
      protocol: TCP
    - name: zpages
      port: 55679
      targetPort: 55679
      protocol: TCP

