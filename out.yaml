        - name: wait-for-postgres
          image: postgres:18.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h globeco-fix-engine-postgresql -p 5432 -U postgres; do
                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done
              echo "PostgreSQL is ready."
        - name: kafka-stabilization-delay
          image: busybox:1.36
          command: ['sh', '-c', 'echo "Kafka is reachable. Waiting 5s for stabilization..."; sleep 5; echo "Stabilization delay complete."']
      containers:
        - name: globeco-fix-engine
          image: kasbench/globeco-fix-engine:1.0.13
          imagePullPolicy: IfNotPresent
