                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done
              echo "PostgreSQL is ready."
      containers:
        - name: globeco-trade-service
          image: kasbench/globeco-trade-service:1.0.4
          imagePullPolicy: IfNotPresent
          ports:
