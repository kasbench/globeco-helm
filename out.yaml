# Source: globeco/templates/globeco-observability/otel-collector-cluster-deployment.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-cluster-config
  namespace: globeco
data:
  config.yaml: |
    receivers:
      k8s_cluster:
        auth_type: serviceAccount
        collection_interval: 30s
        node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, NetworkUnavailable]
      k8s_events:
        auth_type: serviceAccount

      mongodb/order_generation:
        hosts:
          - endpoint: globeco-order-generation-service-mongodb.globeco.svc.cluster.local:27017
        collection_interval: 30s
        initial_delay: 1s
        tls:
          insecure: true
          insecure_skip_verify: true
        metrics:
              mongodb.uptime:
                enabled: true
              mongodb.commands.rate:
                enabled: true
              mongodb.health:
                enabled: true
              mongodb.operation.latency.time:
                enabled: true
              mongodb.queries.rate:
                enabled: true
              mongodb.flushes.rate:
                enabled: false
    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024
        send_batch_max_size: 2048

      memory_limiter:
        limit_mib: 512
        spike_limit_mib: 128
        check_interval: 5s

      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        wait_for_metadata: true
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.start_time
            - k8s.deployment.name
            - k8s.daemonset.name
            - k8s.statefulset.name
            - k8s.job.name
            - k8s.container.name
            - container.image.name
            - container.id
            - container.image.tag
          labels:
            - tag_name: k8s.pod.label.app
              key: app
              from: pod
            - tag_name: k8s.pod.label.version
              key: version
              from: pod
        
        # pod_association: # How to associate the data to a pod (order matters)
        #   - sources: # First try to use the value of the resource attribute k8s.pod.ip
        #       - from: resource_attribute
        #         name: k8s.pod.ip
        #   - sources: # Then try to use the value of the resource attribute k8s.pod.uid
        #       - from: resource_attribute
        #         name: k8s.pod.uid
        #   - sources: # If neither of those work, use the request's connection to get the pod IP.
        #       - from: connection
        

      resource/mongodb_order_generation:
        attributes:
          - key: instance_name
            value: globeco-order-generation-service-mongodb
            action: upsert
          - key: service_name
            value: globeco-order-generation-service-mongodb
            action: upsert

    exporters:
      prometheus:
        endpoint: "0.0.0.0:9464"
        namespace: ""
        const_labels:
          environment: "production"
          collector: "otel-collector-cluster"
        metric_expiration: 1440m
        resource_to_telemetry_conversion:
          enabled: true

      debug: {}
    
    service:
      pipelines:
        metrics:
          receivers: [k8s_cluster]
          processors: [batch]
          exporters: [prometheus, debug]
        
        metrics/mongodb_order_generation:
          receivers: [mongodb/order_generation]
          processors: [memory_limiter, k8sattributes, resource/mongodb_order_generation, batch]
          exporters: [prometheus]

        # logs:
        #   receivers: [k8s_events]
        #   processors: [batch]
        #   exporters: [prometheus]
